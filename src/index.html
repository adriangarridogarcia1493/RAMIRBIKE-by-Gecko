<!DOCTYPE html>
<html lang="es">
<head>
   <meta charset="UTF-8">
   <title>Ramirobike by Gecko</title>
   <link rel="stylesheet" href="style.css">
</head>
<body>
   <div id="game-container" class="level-city">
       <div id="start-screen" class="overlay">
           <h1>RAMIROBIKE</h1>
           <p>by Gecko</p>
           <div id="money-display">💰 <span id="total-money">0</span></div>
           <div class="shop">
               <div class="item" onclick="selectBike('🚲', 0, 1, 3)">🚲 (0)</div>
               <div class="item" onclick="selectBike('🛵', 50, 1.2, 4)">🛵 (50)</div>
               <div class="item" onclick="selectBike('🏍️', 150, 1.5, 6)">🏍️ (150)</div>
               <div class="item" onclick="selectBike('🦎', 1000, 2.5, 10)">🦎✨ (1000)</div>
           </div>
           <p style="font-size: 12px; color: #3498db;">⌨️ <b>ESPACIO</b> para Tiempo Bala (cuando la barra azul esté llena)</p>
           <button class="btn-start" onclick="startGame('city')">CIUDAD 🏙️</button>
           <button class="btn-start" onclick="startGame('school')">INSTITUTO 🏫</button>
           <button class="btn-start" onclick="startGame('beach')">PLAYA 🏖️</button>
           <button class="btn-start" onclick="startGame('forest')" style="background: #27ae60;">BOSQUE 🌲</button>
       </div>


       <div id="road">
           <div id="line-container"></div>
           <div id="player">🚲</div>
       </div>


       <div id="ui">
           <div id="stats"><span id="score">0m</span> | 💰 <span id="session-money">0</span></div>
           <div id="energy-container"><div id="energy-bar"></div></div>
           <div id="special-bar-container"><div id="special-bar"></div></div>
           <div id="status-effects"></div>
       </div>


       <div id="game-over" class="overlay" style="display:none;">
           <h2 id="death-msg">¿Tienes pensado entregarla?</h2>
           <button class="btn-start" onclick="location.reload()">REINTENTAR</button>
       </div>
   </div>
   <script src="script.js"></script>
</body>
</html>
